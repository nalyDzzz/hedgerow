name: Feature request
description: Suggest something Hedgerow should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or task, in your own words. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working. A sketch or a screenshot from another tool is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: How do you manage today?
      description: Any workaround you use, in Hedgerow or elsewhere.
