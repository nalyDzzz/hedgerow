name: CI

# Every push and pull request is checked and built. Pushing a tag like v0.1.0
# additionally collects the installers into a draft GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devpass
        ports:
          - 3306:3306
        # Pinging over TCP only succeeds once the server has finished initialising.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdevpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # Without these the driver tests are skipped.
      TEST_MYSQL_PORT: 3306
      TEST_MYSQL_PASSWORD: devpass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  installer:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            id: windows
            os: windows-latest
          - name: macOS
            id: macos
            os: macos-latest
          - name: Linux
            id: linux
            os: ubuntu-latest
    env:
      # There are no signing certificates yet, so do not go looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      # Start the packaged app and make sure it works before anyone downloads it.
      - name: Launch the packaged app
        if: runner.os != 'Linux'
        run: pnpm smoke
      - name: Launch the packaged app (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm smoke
      - name: Keep the launch screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.id }}
          path: dist/smoke-*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hedgerow-${{ matrix.id }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version in package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json, which says $expected."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hedgerow-*
          path: release
          merge-multiple: true
      # The release starts as a draft so a person reads it before it goes public.
      - name: Create the draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Hedgerow ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            *
