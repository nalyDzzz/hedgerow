# Packaging. `pnpm dist` builds an installer for the operating system it runs on.

# The product name comes from "productName" in package.json.
#
# appId identifies the app to the operating system. It is free to change until the
# first public release; after that, changing it makes Windows and macOS treat the
# app as a different one. Match it to a domain or account you control if you have one.
appId: dev.hedgerow.app

directories:
  output: dist

# Only the built bundles ship. Runtime dependencies (the database drivers) are added
# from package.json "dependencies" automatically.
files:
  - out/**
  - package.json

# No native modules, so there is nothing to recompile for Electron.
npmRebuild: false

win:
  target:
    - nsis

nsis:
  # A normal installer with a choice of folder, rather than a silent one-click install.
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

linux:
  category: Development
  target:
    - AppImage
