# Packaging. `pnpm dist` builds an installer for the operating system it runs on.

# The product name comes from "productName" in package.json.
#
# appId identifies the app to the operating system. Changing it after a release
# makes Windows and macOS treat the app as a different one, so leave it alone.
appId: io.github.nalydzzz.hedgerow

# One naming scheme for every installer, e.g. Hedgerow-0.1.0-mac-arm64.dmg.
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

directories:
  output: dist

# Only the built bundles ship. Runtime dependencies (the database drivers) are added
# from package.json "dependencies" automatically.
files:
  - out/**
  - package.json

# No native modules, so there is nothing to recompile for Electron.
npmRebuild: false

# Icons are generated from build/icon.svg by `pnpm icons`.
win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  # A normal installer with a choice of folder, rather than a silent one-click install.
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  icon: build/icon-mac.png
  category: public.app-category.developer-tools
  # There is no Apple certificate yet, so the app gets an ad-hoc signature. Without
  # any signature, macOS reports a downloaded app as damaged and will not open it.
  # Replace this with a real identity, and turn hardenedRuntime back on, when the
  # app is properly signed and notarized.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64

linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
